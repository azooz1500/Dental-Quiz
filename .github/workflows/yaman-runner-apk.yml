name: Build Yaman Runner APK

on:
  push:
    branches: [ "yaman-runner-apk-build" ]
    paths:
      - "yaman-runner/**"
      - ".github/workflows/yaman-runner-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bundled game
        run: |
          mkdir -p yaman-runner/app/src/main/assets
          cat yaman-runner/html-parts/part*.b64 | tr -d '\n' | base64 -d > yaman-runner/app/src/main/assets/index.html
          test -s yaman-runner/app/src/main/assets/index.html
          echo "Bundled game size: $(wc -c < yaman-runner/app/src/main/assets/index.html) bytes"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        working-directory: yaman-runner
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp yaman-runner/app/build/outputs/apk/debug/app-debug.apk Yaman_Runner_Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaman-Runner-Pro-APK
          path: Yaman_Runner_Pro.apk
          if-no-files-found: error
