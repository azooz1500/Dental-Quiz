<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial;background:#8ed8ff;touch-action:none}canvas{display:block}#hud{position:fixed;inset:12px 14px auto 14px;display:flex;justify-content:space-between;color:white;font-weight:900;text-shadow:0 2px 5px #000;font-size:22px}.pill{background:#152238cc;padding:9px 15px;border-radius:18px}.shop{position:fixed;right:14px;bottom:14px;background:#ffb000;border:0;border-radius:18px;padding:12px 18px;font-weight:bold;font-size:17px}.jump{position:fixed;left:18px;bottom:16px;width:78px;height:78px;border-radius:50%;border:4px solid #fff8;background:#ffffff55;color:white;font-size:35px}.panel{position:fixed;inset:8% 12%;background:#101827ee;color:white;border-radius:24px;padding:18px;display:none;text-align:center;overflow:auto}.item{display:inline-block;background:#26344f;margin:7px;padding:12px;border-radius:15px;min-width:115px}.item button{margin-top:8px;padding:7px;border:0;border-radius:10px}.x{float:right;font-size:26px}</style></head><body>
<canvas id="c"></canvas><div id="hud"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">🪙 <span id="coins">0</span></div></div><button class="jump" id="jump">⬆</button><button class="shop" id="shop">👕 الملابس</button>
<div class="panel" id="panel"><b class="x" id="close">✕</b><h2>دولاب عزوز 😂</h2><p>عملاتك: 🪙 <span id="wallet">0</span></p><div id="items"></div></div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d');let W,H,ground;function size(){W=C.width=innerWidth;H=C.height=innerHeight;ground=H*.78}size();onresize=size;
let y=0,vy=0,score=0,coins=+(localStorage.coins||0),speed=7,dead=false,skin=localStorage.skin||'black',obs=[],cs=[],tick=0;
const skins=[['black','بدلة سوداء',0,'#111'],['blue','بدلة زرقاء',15,'#2474ff'],['red','بدلة حمراء',30,'#e43b3b'],['gold','بدلة ذهبية',60,'#f0b90b']];
function jump(){if(dead){dead=false;score=0;speed=7;obs=[];cs=[];return}if(y===0)vy=-15}document.getElementById('jump').ontouchstart=e=>{e.preventDefault();jump()};C.ontouchstart=jump;
function spawn(){obs.push({x:W+30,w:34+Math.random()*28,h:45+Math.random()*35});if(Math.random()>.25)cs.push({x:W+100+Math.random()*180,y:ground-80-Math.random()*65,r:12,taken:false})}
function player(){let px=W*.18,py=ground-76+y,col=(skins.find(s=>s[0]===skin)||skins[0])[3];x.fillStyle=col;x.fillRect(px-20,py+38,46,42);x.strokeStyle=col;x.lineWidth=12;x.beginPath();x.moveTo(px-8,py+78);x.lineTo(px-22,py+105);x.moveTo(px+15,py+78);x.lineTo(px+29,py+104);x.stroke();x.fillStyle='#f0b58f';x.beginPath();x.arc(px+2,py+23,29,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(px+2,py+13,30,3.2,6.25);x.fill();x.fillStyle='white';x.font='bold 13px Arial';x.textAlign='center';x.fillText('عزوز',px+2,py+27)}
function loop(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#56bdf5');g.addColorStop(1,'#ffe0a1');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#d9ad61';for(let i=0;i<8;i++)x.fillRect(i*W/7,ground-120-(i%3)*30,90,120+(i%3)*30);x.fillStyle='#333';x.fillRect(0,ground,W,H-ground);
if(!dead){tick++;score++;speed=Math.min(13,7+score/1800);if(tick%105===0)spawn();vy+=.8;y+=vy;if(y>0){y=0;vy=0}
obs.forEach(o=>o.x-=speed);cs.forEach(c=>c.x-=speed);
let px=W*.18;for(const o of obs){x.fillStyle='#ff5a36';x.fillRect(o.x,ground-o.h,o.w,o.h);x.fillStyle='white';x.fillRect(o.x,ground-o.h+15,o.w,12);if(o.x<px+25&&o.x+o.w>px-20&&ground-o.h<ground-10+y+75&&y>-o.h)dead=true}
for(const c of cs){if(c.taken)continue;x.font='26px Arial';x.fillText('🪙',c.x,c.y);if(Math.hypot(c.x-px,c.y-(ground-55+y))<48){c.taken=true;coins++;localStorage.coins=coins}}
obs=obs.filter(o=>o.x>-100);cs=cs.filter(c=>c.x>-60&&!c.taken)}player();document.getElementById('score').textContent=Math.floor(score/10);document.getElementById('coins').textContent=coins;
if(dead){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='white';x.font='bold 34px Arial';x.textAlign='center';x.fillText('😂 اصطدمت! اضغط وابدأ من جديد',W/2,H/2)}requestAnimationFrame(loop)}loop();
function shop(){wallet.textContent=coins;items.innerHTML='';skins.forEach(s=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+s[1]+'</b><br>🪙 '+s[2]+'<br><button>'+(skin===s[0]?'لابسها':'شراء / لبس')+'</button>';d.querySelector('button').onclick=()=>{let own=localStorage['own_'+s[0]]||s[2]===0;if(!own){if(coins<s[2])return alert('اجمع عملات أكثر يا بطل 😂');coins-=s[2];localStorage.coins=coins;localStorage['own_'+s[0]]=1}skin=s[0];localStorage.skin=skin;shop()};items.appendChild(d)});panel.style.display='block'}document.getElementById('shop').onclick=shop;document.getElementById('close').onclick=()=>panel.style.display='none';
</script></body></html>
