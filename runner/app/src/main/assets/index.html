<!doctype html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial;background:#80d5ff;touch-action:none}canvas{display:block}.hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 5px #000}.p{background:#13233bd9;padding:9px 14px;border-radius:17px}.btn{position:fixed;border:3px solid #fff8;background:#ffffff55;color:#fff;font-weight:bold}.jump{left:20px;bottom:18px;width:82px;height:82px;border-radius:50%;font-size:38px}.power{left:115px;bottom:25px;border-radius:18px;padding:12px;font-size:17px}.shop{right:15px;bottom:18px;border:0;background:#ffb300;color:#171717;border-radius:18px;padding:13px 17px;font-size:17px;font-weight:bold}.panel{position:fixed;inset:8% 12%;background:#101827f3;color:#fff;border-radius:25px;padding:18px;text-align:center;display:none;overflow:auto}.item{display:inline-block;background:#26344f;margin:7px;padding:12px;border-radius:15px;min-width:120px}.item button{margin-top:8px;border:0;border-radius:9px;padding:7px}.x{float:left;font-size:26px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="p">🏆 <span id="sc">0</span>　🦷 <span id="co">0</span></div><div class="p">❤️ <span id="life">1</span>　🛡️ <span id="shield">0</span></div></div><button id="jump" class="btn jump">⬆</button><button id="power" class="btn power">⚡ مساعدة</button><button id="shop" class="shop">👕 المتجر</button><div id="panel" class="panel"><b id="close" class="x">✕</b><h2>🦷 متجر الدكتور عزوز 😂</h2><p>أسنانك: <span id="wallet"></span> 🦷</p><div id="items"></div></div><script>
const C=document.getElementById('c'),g=C.getContext('2d');let W,H,G;function sz(){W=C.width=innerWidth;H=C.height=innerHeight;G=H*.79}sz();onresize=sz;
let y=0,vy=0,run=0,score=0,coins=+(localStorage.teeth||0),speed=7,dead=0,t=0,obs=[],pick=[],shield=0,magnet=0,skin=localStorage.skin||'black',best=+(localStorage.best||0);
const skins=[['black','طقم أسود',0,'#111'],['doctor','بالطو دكتور',20,'#eee'],['blue','رياضي أزرق',35,'#2474ff'],['gold','الشيخ الذهبي 😂',75,'#e7ad0b']];
function jump(){if(dead){dead=0;score=0;speed=7;obs=[];pick=[];y=0;vy=0;return}if(y===0)vy=-15.5}jump.onclick=jump;C.ontouchstart=jump;
function spawn(){let type=Math.random()<.2?'cavity':'tooth';obs.push({x:W+50,w:55,h:70,type});for(let i=0;i<3+Math.random()*3;i++)pick.push({x:W+130+i*48,y:G-90-Math.sin(i*.8)*45,taken:0})}
function bg(){let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#4bbcff');q.addColorStop(1,'#ffd48a');g.fillStyle=q;g.fillRect(0,0,W,H);g.fillStyle='#fff9';g.beginPath();g.arc(W*.8,75,36,0,7);g.fill();for(let i=0;i<10;i++){let bx=(i*170-(score*speed*.035)%170)-50,bh=90+(i%4)*32;g.fillStyle=['#dba86a','#e8c58b','#b9c9d5'][i%3];g.fillRect(bx,G-bh,130,bh);g.fillStyle='#54758d';for(let a=15;a<110;a+=30)for(let b=18;b<bh-10;b+=30)g.fillRect(bx+a,G-bh+b,12,16)}g.fillStyle='#393c43';g.fillRect(0,G,W,H-G);g.fillStyle='#eee';for(let i=0;i<W;i+=130)g.fillRect(i-(score*2)%130,G+55,70,7)}
function tooth(cx,cy,s,bad=false){g.save();g.translate(cx,cy);g.scale(s,s);g.fillStyle='#fff';g.strokeStyle='#cdd7df';g.lineWidth=3;g.beginPath();g.moveTo(-22,-28);g.quadraticCurveTo(-40,-5,-20,18);g.lineTo(-13,42);g.lineTo(0,20);g.lineTo(13,42);g.lineTo(20,18);g.quadraticCurveTo(40,-5,22,-28);g.quadraticCurveTo(0,-42,-22,-28);g.fill();g.stroke();if(bad){g.fillStyle='#55331d';g.beginPath();g.arc(5,-12,11,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(7,-12,5,0,7);g.fill()}g.restore()}
function player(){let px=W*.18,py=G-90+y,col=(skins.find(s=>s[0]===skin)||skins[0])[3];run+=.2*speed;g.strokeStyle=col;g.lineWidth=13;g.lineCap='round';g.beginPath();g.moveTo(px,py+58);g.lineTo(px-18+Math.sin(run)*18,py+94);g.moveTo(px+15,py+58);g.lineTo(px+30-Math.sin(run)*18,py+94);g.stroke();g.fillStyle=col;g.fillRect(px-20,py+20,48,48);g.strokeStyle='#f1b38c';g.lineWidth=10;g.beginPath();g.moveTo(px-15,py+32);g.lineTo(px-34-Math.sin(run)*12,py+55);g.moveTo(px+23,py+32);g.lineTo(px+43+Math.sin(run)*12,py+48);g.stroke();g.fillStyle='#efb18d';g.beginPath();g.arc(px+3,py,30,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(px+2,py-10,30,3.2,6.25);g.fill();g.fillStyle='#111';g.font='bold 12px Arial';g.textAlign='center';if(dead){g.font='bold 25px Arial';g.fillText('✕   ✕',px+2,py+7)}else{g.fillText('•   •',px+2,py+5)}if(shield){g.strokeStyle='#61e6ff';g.lineWidth=5;g.beginPath();g.arc(px+3,py+38,62,0,7);g.stroke()}}
function frame(){bg();if(!dead){t++;score++;speed=Math.min(14,7+score/1700);if(t%100===0)spawn();vy+=.8;y+=vy;if(y>0){y=0;vy=0}obs.forEach(o=>o.x-=speed);pick.forEach(p=>{p.x-=speed;if(magnet&&p.x<W*.55)p.y+=(G-55+y-p.y)*.06});let px=W*.18;for(const o of obs){tooth(o.x,G-43,1.05,true);if(o.x<px+30&&o.x+45>px-25&&y>-70){if(shield){shield=0;o.x=-100}else{dead=1;best=Math.max(best,Math.floor(score/10));localStorage.best=best}}}for(const p of pick){if(p.taken)continue;tooth(p.x,p.y,.34,false);if(Math.hypot(p.x-px,p.y-(G-55+y))<48){p.taken=1;coins++;localStorage.teeth=coins}}obs=obs.filter(o=>o.x>-100);pick=pick.filter(p=>p.x>-50&&!p.taken);if(magnet)magnet--;}player();sc.textContent=Math.floor(score/10);co.textContent=coins;shield&&shield--;document.getElementById('shield').textContent=shield?1:0;if(dead){g.fillStyle='#0009';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='bold 34px Arial';g.fillText('💀 الدكتور عزوز مات 😂',W/2,H*.42);g.font='20px Arial';g.fillText('اضغط على الشاشة للمحاولة من جديد — أفضل نتيجة '+best,W/2,H*.5)}requestAnimationFrame(frame)}frame();
document.getElementById('power').onclick=()=>{if(coins>=5){coins-=5;localStorage.teeth=coins;if(Math.random()<.5)shield=600;else magnet=600}else alert('تحتاج 5 أسنان 🦷 😂')};
function shopNow(){wallet.textContent=coins;items.innerHTML='';skins.forEach(s=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+s[1]+'</b><br>'+s[2]+' 🦷<br><button>'+(skin===s[0]?'لابسها':'شراء / لبس')+'</button>';d.querySelector('button').onclick=()=>{let own=localStorage['own'+s[0]]||s[2]===0;if(!own){if(coins<s[2])return alert('اجمع أسنان أكثر 😂');coins-=s[2];localStorage.teeth=coins;localStorage['own'+s[0]]=1}skin=s[0];localStorage.skin=skin;shopNow()};items.appendChild(d)});panel.style.display='block'}shop.onclick=shopNow;close.onclick=()=>panel.style.display='none';
</script></body></html>
