<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Azooz Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:none;background:#65bff0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;gap:8px;color:#fff;font-weight:900;text-shadow:0 2px 5px #000}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#12243bd9;padding:9px 13px;border-radius:18px;box-shadow:0 4px 14px #0003}
.controls{position:fixed;left:12px;right:12px;bottom:12px;z-index:5;display:flex;justify-content:space-between;align-items:flex-end}
.jump{width:88px;height:88px;border:none;border-radius:50%;font-size:38px;background:#fffde7dd;box-shadow:0 6px 18px #0004}
.rightBtns{display:flex;gap:8px}
.rightBtns button{border:0;border-radius:16px;padding:12px 14px;font-size:16px;font-weight:800;background:#ffb000}
.panel{display:none;position:fixed;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,430px);max-height:78vh;overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 20px 60px #0007}
.panel.show{display:block}
.item{background:#f3f6fb;border-radius:14px;margin:8px 0;padding:12px}
.item button{margin-top:7px;border:0;border-radius:10px;background:#24344f;color:#fff;padding:9px 12px}
.close{float:left;font-size:22px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="row">
    <div class="pill">🏆 <span id="score">0</span></div>
    <div class="pill">🦷 <span id="coins">0</span></div>
    <div class="pill">⭐ <span id="best">0</span></div>
  </div>
  <div class="pill" id="boost">بدون مساعدة</div>
</div>

<div class="controls">
  <button id="jump" class="jump">⬆️</button>
  <div class="rightBtns">
    <button id="power">⚡ مساعدة</button>
    <button id="shop">👕 الملابس</button>
  </div>
</div>

<div class="panel" id="panel">
  <div id="close" class="close">✕</div>
  <h2>دولاب عزوز 😂</h2>
  <p>رصيدك: <b><span id="wallet">0</span> 🦷</b></p>
  <div id="items"></div>
</div>

const cv=document.getElementById("game"),g=cv.getContext("2d");
let W,H,GROUND;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;GROUND=H*.79}
resize(); addEventListener("resize",resize);

const faceImg=new Image(); faceImg.src=FACE;
const bgImg=new Image(); bgImg.src=BG;
const deathSound=new Audio(DEATH); deathSound.preload="auto";
let unlocked=false;
function unlockAudio(){
  if(unlocked)return; unlocked=true;
  deathSound.volume=.95;
  deathSound.play().then(()=>{deathSound.pause();deathSound.currentTime=0}).catch(()=>{});
}
document.body.addEventListener("touchstart",unlockAudio,{once:true});
document.body.addEventListener("click",unlockAudio,{once:true});

let score=0,best=+(localStorage.azoozBest||0),teeth=+(localStorage.azoozTeeth||0);
let speed=7,vy=0,py=0,dead=false,tick=0,run=0;
let shield=0,magnet=0,rocket=0;
let obstacles=[],coins=[],powers=[];
let skin=localStorage.azoozSkin||"black";

const skins=[
 ["black","بدلة سوداء",0,"#181818"],
 ["doctor","بالطو دكتور",20,"#f7f7f7"],
 ["blue","رياضي أزرق",35,"#2d76ff"],
 ["gold","الشيخ الذهبي 😂",75,"#e6ad13"]
];

function resetGame(){
  score=0;speed=7;vy=0;py=0;dead=false;tick=0;
  shield=0;magnet=0;rocket=0;obstacles=[];coins=[];powers=[];
}
function jump(){
  if(dead){resetGame();return}
  if(rocket>0)return;
  if(py===0)vy=-16;
}
document.getElementById("jump").ontouchstart=e=>{e.preventDefault();jump()};
document.getElementById("jump").onclick=jump;
cv.ontouchstart=jump;cv.onclick=jump;

function spawn(){
  const cols=["#ff5e78","#ff8e39","#8d54ff","#20befe","#ff4eb8"];
  obstacles.push({x:W+80,type:Math.random()<.5?"wrapped":"lollipop",c:cols[Math.floor(Math.random()*cols.length)]});
  let n=3+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++)coins.push({x:W+160+i*55,y:GROUND-72-Math.sin(i)*48,t:false});
  if(Math.random()<.25)powers.push({x:W+260,y:GROUND-112,kind:Math.random()<.5?"shield":"magnet"});
  if(Math.random()<.12)powers.push({x:W+330,y:GROUND-130,kind:"rocket"});
}

function drawTooth(x,y,s=.35){
  g.save();g.translate(x,y);g.scale(s,s);g.fillStyle="#fff";g.strokeStyle="#ced8e2";g.lineWidth=3;
  g.beginPath();g.moveTo(-18,-25);g.quadraticCurveTo(-35,-7,-16,16);g.lineTo(-10,36);g.lineTo(0,18);
  g.lineTo(10,36);g.lineTo(16,16);g.quadraticCurveTo(35,-7,18,-25);g.quadraticCurveTo(0,-36,-18,-25);g.fill();g.stroke();g.restore();
}

function drawCandy(o){
  g.save();g.translate(o.x,GROUND-28);
  if(o.type==="wrapped"){
    g.fillStyle=o.c;
    g.beginPath();g.moveTo(-52,-6);g.lineTo(-31,-20);g.lineTo(-31,5);g.fill();
    g.beginPath();g.moveTo(52,-6);g.lineTo(31,-20);g.lineTo(31,5);g.fill();
    g.beginPath();g.roundRect(-31,-27,62,39,13);g.fill();
  }else{
    g.strokeStyle="#d8b67d";g.lineWidth=7;g.beginPath();g.moveTo(0,19);g.lineTo(0,50);g.stroke();
    g.fillStyle=o.c;g.beginPath();g.arc(0,-3,29,0,Math.PI*2);g.fill();
  }
  g.strokeStyle="#1e1e1e";g.lineWidth=3;
  g.beginPath();g.moveTo(-15,-11);g.lineTo(-4,-15);g.moveTo(15,-11);g.lineTo(4,-15);g.stroke();
  g.fillStyle="#111";g.beginPath();g.arc(-9,-4,3.5,0,7);g.arc(9,-4,3.5,0,7);g.fill();
  g.strokeStyle="#111";g.beginPath();g.arc(0,9,12,.2,2.94,true);g.stroke();g.restore();
}

function background(){
  let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#57c1fb");grad.addColorStop(1,"#ffd98b");
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  if(bgImg.complete&&bgImg.width){
    g.save();g.globalAlpha=.18;
    let dw=W*.45,dh=dw*bgImg.height/bgImg.width;
    g.drawImage(bgImg,W*.55,H*.01,dw,dh);g.restore();
  }
  for(let i=0;i<10;i++){
    let bx=(i*160-(score*speed*.035)%160)-35,bh=95+(i%4)*38;
    g.fillStyle=["#e5b777","#f0cb94","#b6c9d7","#79a1bb"][i%4];g.fillRect(bx,GROUND-bh,112,bh);
    g.fillStyle="#58758b";
    for(let a=15;a<95;a+=27)for(let b=15;b<bh-15;b+=28)g.fillRect(bx+a,GROUND-bh+b,10,13);
  }
  g.fillStyle="#3e434a";g.fillRect(0,GROUND,W,H-GROUND);
  g.fillStyle="#f0f0f0";for(let i=0;i<W;i+=82)g.fillRect(i+18,GROUND+24,42,7);
}

function color(){return (skins.find(s=>s[0]===skin)||skins[0])[3]}

function player(){
  const x=W*.18,y=GROUND-98+py;run+=.23*speed;let c=color();
  g.strokeStyle=c;g.lineWidth=14;g.lineCap="round";
  g.beginPath();g.moveTo(x-4,y+66);g.lineTo(x-22+Math.sin(run)*20,y+104);
  g.moveTo(x+16,y+66);g.lineTo(x+34-Math.sin(run)*20,y+104);g.stroke();
  g.fillStyle=c;g.fillRect(x-24,y+20,52,52);
  if(skin==="doctor"){g.fillStyle="#fff";g.fillRect(x-29,y+15,62,58);g.fillStyle="#8da6c8";g.fillRect(x-2,y+26,5,35)}
  g.strokeStyle="#efb48f";g.lineWidth=10;g.beginPath();
  g.moveTo(x-18,y+31);g.lineTo(x-43-Math.sin(run)*12,y+51);
  g.moveTo(x+23,y+31);g.lineTo(x+45+Math.sin(run)*12,y+50);g.stroke();

  g.save();g.beginPath();g.arc(x+2,y-4,31,0,Math.PI*2);g.clip();
  if(faceImg.complete&&faceImg.width)g.drawImage(faceImg,x-30,y-36,64,64);
  g.restore();

  if(dead){
    g.strokeStyle="#111";g.lineWidth=4;g.beginPath();
    g.moveTo(x-14,y-10);g.lineTo(x-5,y-1);g.moveTo(x-5,y-10);g.lineTo(x-14,y-1);
    g.moveTo(x+9,y-10);g.lineTo(x+18,y-1);g.moveTo(x+18,y-10);g.lineTo(x+9,y-1);g.stroke();
  }
  if(shield>0){g.strokeStyle="#64d2ff";g.lineWidth=6;g.beginPath();g.arc(x+2,y+22,60,0,7);g.stroke()}
  if(rocket>0){g.fillStyle="#ff7b00";g.beginPath();g.moveTo(x-28,y+56);g.lineTo(x-45,y+68);g.lineTo(x-28,y+73);g.fill()}
  return{x,y};
}

function die(){
  dead=true;best=Math.max(best,Math.floor(score/10));localStorage.azoozBest=best;
  try{deathSound.pause();deathSound.currentTime=0;deathSound.play().catch(()=>{})}catch(e){}
  try{
    speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("يا بحبوح قتلتني ههههه");
    u.lang="ar-SA";u.rate=1.05;u.pitch=1.35;speechSynthesis.speak(u);
  }catch(e){}
}

function boostText(){
  let t="بدون مساعدة";
  if(shield>0)t="🛡️ درع";if(magnet>0)t="🧲 مغناطيس";if(rocket>0)t="🚀 اندفاع";
  document.getElementById("boost").textContent=t;
}

function frame(){
  background();
  if(!dead){
    tick++;score++;speed=Math.min(15,7+score/1700);
    if(tick%95===0)spawn();
    if(rocket>0){rocket--;py=-72+Math.sin(tick*.5)*8;vy=0}
    else{vy+=.85;py+=vy;if(py>0){py=0;vy=0}}
    if(shield>0)shield--;if(magnet>0)magnet--;
    obstacles.forEach(o=>o.x-=speed+2);coins.forEach(c=>{c.x-=speed+2;if(magnet>0&&c.x<W*.55)c.y+=(GROUND-58+py-c.y)*.07});
    powers.forEach(p=>p.x-=speed+2);

    let p=player();
    for(const o of obstacles){
      drawCandy(o);
      if(o.x<p.x+28&&o.x+70>p.x-24&&py>-74){
        if(shield>0){shield=0;o.x=-200} else if(rocket<=0) die();
      }
    }
    for(const c of coins){
      if(!c.t){drawTooth(c.x,c.y);if(Math.hypot(c.x-p.x,c.y-(GROUND-48+py))<46){c.t=true;teeth++;localStorage.azoozTeeth=teeth}}
    }
    g.font="30px Arial";
    for(const a of powers){
      g.fillText(a.kind==="shield"?"🛡️":a.kind==="magnet"?"🧲":"🚀",a.x,a.y);
      if(Math.hypot(a.x-p.x,a.y-(GROUND-48+py))<44){
        if(a.kind==="shield")shield=520;if(a.kind==="magnet")magnet=520;if(a.kind==="rocket")rocket=210;a.x=-100;
      }
    }
    obstacles=obstacles.filter(o=>o.x>-120);coins=coins.filter(c=>c.x>-50&&!c.t);powers=powers.filter(a=>a.x>-50);
  } else {
    player();g.fillStyle="rgba(0,0,0,.46)";g.fillRect(0,0,W,H);
    g.fillStyle="#fff";g.textAlign="center";g.font="bold 34px Arial";g.fillText("😂 يا بحبوح قتلتني",W/2,H*.43);
    g.font="bold 20px Arial";g.fillText("اضغط الشاشة وارجع اجري",W/2,H*.5);
  }
  document.getElementById("score").textContent=Math.floor(score/10);
  document.getElementById("coins").textContent=teeth;
  document.getElementById("best").textContent=best;
  boostText();
  requestAnimationFrame(frame);
}
frame();

const panel=document.getElementById("panel"),items=document.getElementById("items"),wallet=document.getElementById("wallet");
document.getElementById("shop").onclick=()=>{
  wallet.textContent=teeth;items.innerHTML="";
  skins.forEach(s=>{
    let own=localStorage["own_"+s[0]]||s[2]===0;
    let d=document.createElement("div");d.className="item";
    d.innerHTML="<b>"+s[1]+"</b><div>السعر: "+s[2]+" 🦷</div><button>"+(skin===s[0]?"لابسها":own?"لبس":"شراء / لبس")+"</button>";
    d.querySelector("button").onclick=()=>{
      if(!own){if(teeth<s[2])return alert("اجمع أسنان أكثر 😂");teeth-=s[2];localStorage.azoozTeeth=teeth;localStorage["own_"+s[0]]=1}
      skin=s[0];localStorage.azoozSkin=skin;document.getElementById("shop").click();
    };
    items.appendChild(d);
  });
  panel.classList.add("show");
};
document.getElementById("close").onclick=()=>panel.classList.remove("show");
document.getElementById("power").onclick=()=>{
  if(teeth<6)return alert("تحتاج 6 أسنان للمساعدة 😂");
  teeth-=6;localStorage.azoozTeeth=teeth;
  let r=Math.random();if(r<.34)shield=520;else if(r<.67)magnet=520;else rocket=210;
};
</script>
</body>
</html>
