<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>اختبر نفسك - طب أسنان</title>
<style>
:root{--bg:#0b1220;--card:#111c31;--card2:#17243c;--text:#f4f7fb;--muted:#9fb0c9;--accent:#4f8cff;--green:#1fbf75;--red:#ef5350;--amber:#f5b942;--line:#263754}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#0b1220,#0e1728 55%,#0b1220);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button{font:inherit}
.wrap{max-width:760px;margin:auto;padding:18px 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:21px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:13px;padding:10px 12px}
.hero{background:linear-gradient(135deg,#1b2e52,#13223d);border:1px solid #29466f;border-radius:20px;padding:18px;margin:10px 0 18px;box-shadow:0 14px 40px #0004}
.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.subject{width:100%;text-align:right;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:17px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.subject:active{transform:scale(.99)}.subject .name{font-weight:750}.count{color:var(--muted);font-size:12px;margin-top:5px}.pill{min-width:46px;text-align:center;background:#213657;border-radius:999px;padding:7px 9px;color:#bcd3ff;font-weight:700;font-size:12px}
.wrongCard{border-color:#6d3b22;background:linear-gradient(135deg,#2d201a,#1d1918)}.wrongCard .pill{background:#4a2a1e;color:#ffc39d}
.quizHeader{position:sticky;top:0;z-index:5;background:#0b1220ee;padding:10px 0 11px}
.progressRow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.progress{height:7px;background:#1a2941;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#4f8cff,#70a1ff);width:0;transition:.25s}
.questionCard{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:0 10px 30px #0003}
.qnum{font-size:12px;color:#8fa8cb;margin-bottom:8px}.qtext{direction:ltr;text-align:left;font-size:18px;line-height:1.55;font-weight:720;margin-bottom:16px}
.options{display:grid;gap:10px}.opt{direction:ltr;text-align:left;width:100%;border:1px solid #314563;background:var(--card2);color:#edf3ff;border-radius:14px;padding:13px 14px;line-height:1.45;min-height:52px}
.opt.correct{border-color:#3ad38d;background:#123b2c;color:#d9ffed}.opt.wrong{border-color:#ff6b68;background:#412021;color:#ffe3e2}.opt.dim{opacity:.58}.opt:disabled{cursor:default}
.feedback{margin:14px 0 0;border-radius:13px;padding:11px 13px;font-weight:750;display:none}.feedback.ok{display:block;background:#123b2c;color:#a8f4ce;border:1px solid #257b58}.feedback.no{display:block;background:#412021;color:#ffbbb8;border:1px solid #8b3a3a}
.actions{display:flex;gap:10px;margin-top:14px}.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 16px;font-weight:800}.primary{background:var(--accent);color:white;flex:1}.secondary{background:#1d2d47;color:#dbe8ff;border:1px solid var(--line)}.danger{background:#422226;color:#ffd6d4;border:1px solid #72363a}
.result{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 18px;margin-top:35px}.score{font-size:48px;font-weight:900;margin:8px 0}.pct{font-size:18px;color:#a9c2ea}.result .actions{justify-content:center}.result .primary{flex:0 1 220px}
.empty{text-align:center;color:var(--muted);padding:45px 10px}.small{font-size:12px;color:var(--muted)}
.settings{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:center}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="add_maxillofacial_prosthodontics.js"></script>
<script src="add_surgical_implantology.js"></script>
<script src="add_pharmacology.js"></script>
<script src="add_public_health.js"></script>
<script src="add_orthodontics.js"></script>
<script src="add_periodontology.js"></script>
<script src="add_pediatric_dentistry.js"></script>
<script src="add_comprehensive_supplement.js"></script>
<script>
const state={all:[],subjects:[],mode:'home',quiz:[],idx:0,score:0,answered:false,selected:null,currentSubject:null,reviewWrong:false};
const app=document.getElementById('app');
const storeKey='dentalquiz_wrong_v1';
function getWrong(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')}catch(e){return[]}}
function setWrong(ids){localStorage.setItem(storeKey,JSON.stringify([...new Set(ids)]))}
function addWrong(id){let a=getWrong();if(!a.includes(id)){a.push(id);setWrong(a)}}
function removeWrong(id){setWrong(getWrong().filter(x=>x!==id))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function home(){state.mode='home';state.quiz=[];state.idx=0;state.score=0;state.answered=false;renderHome()}
function renderHome(){
 const counts={};state.all.forEach(q=>counts[q.subject]=(counts[q.subject]||0)+1);const wrong=getWrong();
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">اختبر نفسك - طب أسنان</div><div class="sub">364 سؤال من المراجعة المركزة • يعمل بدون إنترنت</div></div></div>
 <div class="hero"><h1>اختر المادة وابدأ الحل 🎯</h1><p>بعد كل إجابة سيظهر لك فورًا هل هي صحيحة أو خاطئة. الأسئلة التي تخطئ فيها تُحفظ تلقائيًا في قسم مستقل للمراجعة.</p></div>
 <div class="grid">${state.subjects.map(s=>`<button class="subject" onclick="startSubject('${esc(s).replaceAll("'","\\'")}')"><div><div class="name">${esc(s)}</div><div class="count">حل المادة كاملة</div></div><div class="pill">${counts[s]||0}</div></button>`).join('')}
 <button class="subject wrongCard" onclick="startWrong()"><div><div class="name">الأسئلة الخاطئة</div><div class="count">راجع فقط الأسئلة التي أخطأت فيها</div></div><div class="pill">${wrong.length}</div></button></div>
 <div class="settings"><button class="danger" onclick="clearWrong()">مسح قائمة الأخطاء</button></div></div>`;
}
function startSubject(s){state.currentSubject=s;state.quiz=state.all.filter(q=>q.subject===s);startQuiz(false)}
function startWrong(){const ids=new Set(getWrong());state.currentSubject='الأسئلة الخاطئة';state.quiz=state.all.filter(q=>ids.has(q.id));if(!state.quiz.length){app.innerHTML=`<div class="wrap"><div class="empty">لا توجد أسئلة خاطئة الآن ✅<div style="margin-top:18px"><button class="primary" onclick="home()">العودة</button></div></div></div>`;return}startQuiz(true)}
function startQuiz(review){state.reviewWrong=review;state.idx=0;state.score=0;state.answered=false;state.selected=null;renderQuiz()}
function renderQuiz(){if(state.idx>=state.quiz.length){return renderResult()}const q=state.quiz[state.idx];const pct=(state.idx/state.quiz.length)*100;
 app.innerHTML=`<div class="wrap"><div class="quizHeader"><div class="top"><button class="iconbtn" onclick="home()">الرئيسية</button><div style="text-align:left"><div class="small">${esc(state.currentSubject)}</div></div></div><div class="progressRow"><span>${state.idx+1} / ${state.quiz.length}</span><span>الصحيح: ${state.score}</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>
 <div class="questionCard"><div class="qnum">Question ${state.idx+1}</div><div class="qtext">${esc(q.q)}</div><div class="options">${q.options.map(([l,t])=>`<button class="opt" data-letter="${l}" onclick="choose('${l}')"><b>${l}.</b> ${esc(t)}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="actions"><button class="secondary" onclick="prevQ()" ${state.idx===0?'disabled style="opacity:.45"':''}>السؤال السابق</button><button id="next" class="primary" onclick="nextQ()">السؤال التالي</button></div></div></div>`;
}
function choose(letter){if(state.answered)return;state.answered=true;state.selected=letter;const q=state.quiz[state.idx];const ok=letter===q.correct;if(ok){state.score++;if(state.reviewWrong)removeWrong(q.id)}else addWrong(q.id);
 document.querySelectorAll('.opt').forEach(b=>{const l=b.dataset.letter;b.disabled=true;if(l===q.correct)b.classList.add('correct');else if(l===letter)b.classList.add('wrong');else b.classList.add('dim')});
 const fb=document.getElementById('fb');fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'✓ إجابة صحيحة':'✗ إجابة خاطئة — الإجابة الصحيحة: '+q.correct;document.getElementById('next').style.display='block';
}
function nextQ(){state.idx++;state.answered=false;state.selected=null;renderQuiz()}
function prevQ(){if(state.idx<=0)return;state.idx--;state.answered=false;state.selected=null;renderQuiz()}
function renderResult(){const total=state.quiz.length;const pct=total?Math.round(state.score*100/total):0;app.innerHTML=`<div class="wrap"><div class="result"><div class="small">النتيجة النهائية</div><div class="score">${state.score}/${total}</div><div class="pct">${pct}%</div><p class="sub">الأسئلة الخاطئة محفوظة تلقائيًا للمراجعة.</p><div class="actions"><button class="primary" onclick="restart()">إعادة الاختبار</button><button class="secondary" onclick="home()">الرئيسية</button></div></div></div>`}
function restart(){state.idx=0;state.score=0;state.answered=false;renderQuiz()}
function clearWrong(){setWrong([]);renderHome()}
